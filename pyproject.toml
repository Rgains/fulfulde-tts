[project]
name = "fub-tts"
version = "0.1.0"
description = "Auditable Adamawa Fulfulde (fub) TTS data preparation"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
authors = [
  { name = "Fulfulde TTS contributors" },
]
dependencies = []

[dependency-groups]
cpu-sanity = [
  "coqui-tts==0.27.5",
  "coqui-tts-trainer==0.3.3",
  "numpy>=1.26,<2",
  "soundfile>=0.13",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "torchvision>=0.22,<0.24",
  "transformers>=4.57,<5",
]
demo = [
    "streamlit>=1.61.1",
]

[project.scripts]
fub-tts = "fub_tts.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fub_tts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
