[project]
name = "fub-tts"
version = "0.1.0"
description = "Auditable Adamawa Fulfulde (fub) TTS data preparation"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
authors = [
  { name = "Fulfulde TTS contributors" },
]
dependencies = []

[project.scripts]
fub-tts = "fub_tts.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fub_tts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

